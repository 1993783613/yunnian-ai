    /* 布局 */

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat-card { background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 2px 12px rgba(90,70,180,.06); }
    .stat-card .num { font-size: 26px; font-weight: 800; color: #7C6AF2; }
    .stat-card .lbl { font-size: 12px; color: #9A94B0; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: #9A94B0; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #EFEAF8; white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid #F5F2FB; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .tag { display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 9px; font-weight: 600; }
    .tag-ok { background: #E8F6EE; color: #3B9C6A; }
    .tag-ban { background: #FDECEC; color: #E34D4D; }
    .tag-refund { background: #FFF4E5; color: #D9822B; }

    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: #9A94B0; }
    .field input, .field textarea, .field select { padding: 9px 12px; border: 1.5px solid #E4E0F2; border-radius: 10px; outline: none; min-width: 160px; }
    .field input:focus, .field textarea:focus { border-color: #7C6AF2; }
    .field textarea { width: 420px; max-width: 100%; resize: vertical; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .empty { text-align: center; color: #B4AEC8; padding: 30px 0; font-size: 13px; }

    .qr-preview { width: 170px; height: 170px; border: 1.5px dashed #C9BFEC; border-radius: 14px; background: #F8F6FD; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; color: #9A94B0; font-size: 12px; text-align: center; line-height: 1.8; }
    .qr-preview img { width: 100%; height: 100%; object-fit: contain; }

    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(43,39,64,.92); color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; }
    .toast.show { opacity: 1; }

    @media (max-width: 760px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 10px; border-bottom: 1px solid #EBE7F6; }
      .logo { display: none; }
      .nav-item { white-space: nowrap; width: auto; }
      .main { padding: 16px 14px; }
      .field textarea { width: 100%; }
      .table-wrap { overflow-x: auto; }
    }
  </style>

<script src="./js/site-data.js?v=20260906i"></script>
<script>
/* ===== 登录 ===== */
function adminPass() { return localStorage.getItem('yn_admin_pass') || 'admin888'; }
function adminLogin() {
  const v = document.getElementById('adminPass').value;
  if (v === adminPass()) {
    sessionStorage.setItem('yn_admin_ok', '1');
    enterAdmin();
  } else {
    document.getElementById('loginErr').textContent = '密码错误，请重试';
  }
}
function adminLogout() { sessionStorage.removeItem('yn_admin_ok'); location.reload(); }
(function () {
  if (sessionStorage.getItem('yn_admin_ok') === '1') enterAdmin();
})();

function enterAdmin() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('layout').style.display = 'flex';
  switchTab('dash', document.querySelector('.nav-item'));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function fmtTime(ts) {
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

const TAB_TITLES = { dash: '数据概览', users: '会员管理', orders: '订单记录', agents: '代理分成', products: '商品管理', packages: '充值套餐价格', contact: '客服 / 合作设置', data: '数据管理' };
function switchTab(tab, btn) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('pageTitle').textContent = TAB_TITLES[tab] || '';
  const c = document.getElementById('tabContent');
  if (tab === 'dash') renderDash(c);
  if (tab === 'users') renderUsers(c);
  if (tab === 'orders') renderOrders(c);
  if (tab === 'agents') renderAgents(c);
  if (tab === 'products') renderProducts(c);
  if (tab === 'packages') renderPkgs(c);
  if (tab === 'contact') renderContact(c);
  if (tab === 'data') renderDataTab(c);
}

/* ===== 概览 ===== */
function renderDash(c) {
  const users = getUsers(), orders = getOrders().filter(o => o.status === 'paid');
  const income = orders.reduce((s, o) => s + parseFloat(o.amount || 0), 0);
  siteData = loadSiteData();
  c.innerHTML =
    '<div class="stat-grid">' +
    '<div class="stat-card"><div class="num">' + users.length + '</div><div class="lbl">会员总数</div></div>' +
    '<div class="stat-card"><div class="num">' + orders.length + '</div><div class="lbl">支付订单数</div></div>' +
    '<div class="stat-card"><div class="num">¥' + income.toFixed(1) + '</div><div class="lbl">累计收入</div></div>' +
    '<div class="stat-card"><div class="num">' + (siteData.agents || []).length + '</div><div class="lbl">代理数</div></div>' +
    '<div class="stat-card"><div class="num">' + (siteData.products || []).length + '</div><div class="lbl">在售商品</div></div>' +
    '</div>' +
    '<div class="card"><b>📝 使用提示</b><div style="font-size:13px;color:#9A94B0;margin-top:8px;line-height:1.9">' +
    '· 本后台与前台同域名，修改保存后<b>刷新前台页面</b>立即生效。<br>' +
    '· 商城商品、价格、详情在「商品管理」里维护；客服二维码 / 合作图片在「客服 / 合作」里上传。<br>' +
    '· 换设备发布：在「数据管理」导出配置 JSON，替换仓库文件即可。</div></div>';
}

/* ===== 会员管理 ===== */
function renderUsers(c, kw) {
  let users = getUsers();
  if (kw) users = users.filter(u => (u.account + u.nickname).indexOf(kw) > -1);
  const agents = loadSiteData().agents || [];
  c.innerHTML =
    '<div class="card"><div class="toolbar">' +
    '<input id="userKw" placeholder="搜索账号/昵称" style="padding:9px 12px;border:1.5px solid #E4E0F2;border-radius:10px;outline:none;" onkeydown="if(event.key===\'Enter\')renderUsers(document.getElementById(\'tabContent\'),this.value.trim())">' +
    '<button class="btn btn-light btn-sm" onclick="renderUsers(document.getElementById(\'tabContent\'),document.getElementById(\'userKw\').value.trim())">搜索</button>' +
    '<button class="btn btn-primary btn-sm" onclick="addUser()">＋ 新增会员</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>账号</th><th>昵称</th><th>念想值</th><th>所属代理</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>' +
    (users.length ? users.map(u => {
      const ag = agents.find(a => a.id === u.agentId);
      return '<tr><td>' + esc(u.account) + '</td><td>' + esc(u.nickname || '-') + '</td><td>' + esc(u.balance || 0) + '</td>' +
        '<td>' + (ag ? esc(ag.name) + ' (' + ag.rate + '%)' : '-') + '</td>' +
        '<td><span class="tag ' + (u.status === 'banned' ? 'tag-ban' : 'tag-ok') + '">' + (u.status === 'banned' ? '已封禁' : '正常') + '</span></td>' +
        '<td>' + fmtTime(u.createdAt) + '</td>' +
        '<td><button class="btn btn-light btn-sm" onclick="adjustBalance(\'' + u.id + '\')">调余额</button> ' +
        '<button class="btn btn-light btn-sm" onclick="toggleBan(\'' + u.id + '\')">' + (u.status === 'banned' ? '解封' : '封禁') + '</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="delUser(\'' + u.id + '\')">删除</button></td></tr>';
    }).join('') : '<tr><td colspan="7"><div class="empty">暂无会员</div></td></tr>') +
    '</tbody></table></div></div>';
}
function addUser() {
  const account = prompt('新会员账号（手机号）');
  if (!account) return;
  const users = getUsers();
  if (users.some(u => u.account === account)) { toast('账号已存在'); return; }
  users.unshift({ id: 'u' + Date.now(), account: account, nickname: prompt('昵称（可留空）') || '', balance: 0, status: 'active', agentId: '', createdAt: Date.now() });
  saveUsers(users);
  toast('会员已添加');
  renderUsers(document.getElementById('tabContent'));
}
function adjustBalance(id) {
  const users = getUsers();
  const u = users.find(x => x.id === id);
  if (!u) return;
  const v = prompt('调整「' + (u.nickname || u.account) + '」的念想值（当前 ' + (u.balance || 0) + '，输入正负数）', String(u.balance || 0));
  if (v === null) return;
  u.balance = parseInt(v, 10) || 0;
  saveUsers(users);
  toast('余额已更新');
  renderUsers(document.getElementById('tabContent'));
}
function toggleBan(id) {
  const users = getUsers();
  const u = users.find(x => x.id === id);
  if (!u) return;
  u.status = u.status === 'banned' ? 'active' : 'banned';
  saveUsers(users);
  renderUsers(document.getElementById('tabContent'));
}
function delUser(id) {
  if (!confirm('确定删除该会员？')) return;
  saveUsers(getUsers().filter(u => u.id !== id));
  toast('已删除');
  renderUsers(document.getElementById('tabContent'));
}

/* ===== 订单记录 ===== */
function renderOrders(c) {
  const orders = getOrders();
  c.innerHTML =
    '<div class="card"><div class="toolbar">' +
    '<button class="btn btn-primary btn-sm" onclick="genDemoOrder()">＋ 生成演示订单</button>' +
    '<button class="btn btn-light btn-sm" onclick="exportOrdersCSV()">导出 CSV</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>订单号</th><th>账号</th><th>类型</th><th>标题</th><th>金额</th><th>念想值</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>' +
    (orders.length ? orders.map(o =>
      '<tr><td style="font-size:12px">' + esc(o.no) + '</td><td>' + esc(o.account) + '</td><td>' + esc(o.type) + '</td><td>' + esc(o.title || '-') + '</td>' +
      '<td><b>¥' + esc(o.amount) + '</b></td><td>' + esc(o.credits || 0) + '</td>' +
      '<td><span class="tag ' + (o.status === 'paid' ? 'tag-ok' : 'tag-refund') + '">' + (o.status === 'paid' ? '已支付' : '已退款') + '</span></td>' +
      '<td style="font-size:12px">' + fmtTime(o.createdAt) + '</td>' +
      '<td>' + (o.status === 'paid' ? '<button class="btn btn-light btn-sm" onclick="refundOrder(\'' + o.id + '\')">退款</button> ' : '') +
      '<button class="btn btn-danger btn-sm" onclick="delOrder(\'' + o.id + '\')">删除</button></td></tr>'
    ).join('') : '<tr><td colspan="9"><div class="empty">暂无订单</div></td></tr>') +
    '</tbody></table></div></div>';
}
function genDemoOrder() {
  const users = getUsers();
  const acc = users.length ? users[Math.floor(Math.random() * users.length)].account : '13800000000';
  const products = loadSiteData().products;
  const isShop = Math.random() < 0.35 && products && products.length;
  const p = isShop ? products[Math.floor(Math.random() * products.length)] : null;
  addOrder({
    type: isShop ? '商城' : '充值',
    title: isShop ? '商城-' + p.name : '念想值充值',
    amount: isShop ? p.price : ['9.9', '30', '98', '198', '598'][Math.floor(Math.random() * 5)],
    credits: isShop ? 0 : [50, 200, 800, 1800, 5000][Math.floor(Math.random() * 5)],
    account: acc
  });
  toast('演示订单已生成');
  renderOrders(document.getElementById('tabContent'));
}
function refundOrder(id) {
  if (!confirm('确认退款该订单？')) return;
  const orders = getOrders();
  const o = orders.find(x => x.id === id);
  if (o) { o.status = 'refund'; saveOrders(orders); }
  renderOrders(document.getElementById('tabContent'));
}
function delOrder(id) {
  if (!confirm('确定删除该订单记录？')) return;
  saveOrders(getOrders().filter(o => o.id !== id));
  renderOrders(document.getElementById('tabContent'));
}
function exportOrdersCSV() {
  const rows = [['订单号', '账号', '类型', '标题', '金额', '念想值', '状态', '时间']].concat(
    getOrders().map(o => [o.no, o.account, o.type, o.title || '', o.amount, o.credits || 0, o.status === 'paid' ? '已支付' : '已退款', fmtTime(o.createdAt)])
  );
  const csv = '\uFEFF' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  downloadFile('订单记录-' + new Date().toISOString().slice(0, 10) + '.csv', csv, 'text/csv');
  toast('CSV 已导出');
}
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type: (type || 'application/json') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ===== 代理分成 ===== */
function renderAgents(c) {
  siteData = loadSiteData();
  const agents = siteData.agents || [];
  const users = getUsers();
  const orders = getOrders().filter(o => o.status === 'paid');
  c.innerHTML =
    '<div class="card"><div class="toolbar"><button class="btn btn-primary btn-sm" onclick="addAgent()">＋ 新增代理</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>代理</th><th>账号</th><th>分成比例</th><th>旗下会员</th><th>会员消费</th><th>预估分成</th><th>操作</th></tr></thead><tbody>' +
    (agents.length ? agents.map(a => {
      const members = users.filter(u => u.agentId === a.id);
      const consume = orders.filter(o => members.some(m => m.account === o.account)).reduce((s, o) => s + parseFloat(o.amount || 0), 0);
      return '<tr><td><b>' + esc(a.name) + '</b></td><td>' + esc(a.account) + '</td>' +
        '<td><span class="tag tag-ok">' + a.rate + '%</span></td><td>' + members.length + ' 人</td>' +
        '<td>¥' + consume.toFixed(1) + '</td><td><b style="color:#7C6AF2">¥' + (consume * a.rate / 100).toFixed(1) + '</b></td>' +
        '<td><button class="btn btn-light btn-sm" onclick="editAgent(\'' + a.id + '\')">编辑</button> ' +
        '<button class="btn btn-light btn-sm" onclick="bindMember(\'' + a.id + '\')">绑会员</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="delAgent(\'' + a.id + '\')">删除</button></td></tr>';
    }).join('') : '<tr><td colspan="7"><div class="empty">暂无代理，点上方按钮新增</div></td></tr>') +
    '</tbody></table></div></div>';
}
function addAgent() {
  const name = prompt('代理名称'); if (!name) return;
  const account = prompt('代理账号（手机/微信）'); if (!account) return;
  const rate = parseInt(prompt('分成比例（%），如 20', '20'), 10);
  if (!(rate > 0 && rate <= 100)) { toast('分成比例需为 1-100'); return; }
  const pass = prompt('设置代理登录密码（代理用它登录前台「超级代理中心」）', '123456') || '123456';
  siteData.agents.push({ id: 'a' + Date.now(), name: name, account: account, pass: pass, rate: rate, createdAt: Date.now() });
  persistSiteData();
  toast('代理已新增，账号 ' + account + ' / 密码 ' + pass);
  renderAgents(document.getElementById('tabContent'));
}
function editAgent(id) {
  const a = siteData.agents.find(x => x.id === id);
  if (!a) return;
  const rate = parseInt(prompt('修改「' + a.name + '」的分成比例（%）', String(a.rate)), 10);
  if (!(rate > 0 && rate <= 100)) return;
  a.rate = rate;
  const pass = prompt('重置登录密码（点「取消」或留空则不修改）', '');
  if (pass) a.pass = pass;
  persistSiteData();
  toast('已保存' + (pass ? '，新密码 ' + pass : ''));
  renderAgents(document.getElementById('tabContent'));
}
function bindMember(agentId) {
  const users = getUsers();
  const account = prompt('要绑定到该代理下的会员账号');
  if (!account) return;
  const u = users.find(x => x.account === account);
  if (!u) { toast('未找到该会员'); return; }
  u.agentId = agentId;
  saveUsers(users);
  toast('已绑定');
  renderAgents(document.getElementById('tabContent'));
}
function delAgent(id) {
  if (!confirm('确定删除该代理？旗下会员将解绑。')) return;
  siteData.agents = siteData.agents.filter(a => a.id !== id);
  persistSiteData();
  const users = getUsers();
  users.forEach(u => { if (u.agentId === id) u.agentId = ''; });
  saveUsers(users);
  renderAgents(document.getElementById('tabContent'));
}

/* ===== 商品管理 ===== */
let editingProductId = '';
function renderProducts(c) {
  siteData = loadSiteData();
  const list = siteData.products || [];
  c.innerHTML =
    '<div class="card">' +
    '<div class="toolbar"><button class="btn btn-primary btn-sm" onclick="showProductForm(\'\')">＋ 新增商品</button></div>' +
    '<div id="productFormWrap" style="display:none;margin-bottom:16px;border:1.5px solid #E4E0F2;border-radius:14px;padding:16px;">' +
    '<div class="form-row">' +
    '<div class="field"><label>商品名称</label><input id="pfName" placeholder="如：时光信使"></div>' +
    '<div class="field"><label>价格（元）</label><input id="pfPrice" placeholder="9.9"></div>' +
    '<div class="field"><label>已售数量</label><input id="pfSold" placeholder="0"></div>' +
    '<div class="field"><label>图标 emoji</label><input id="pfEmoji" placeholder="🎁"></div>' +
    '</div>' +
    '<div class="form-row"><div class="field"><label>一句话介绍</label><input id="pfBrief" style="min-width:300px" placeholder="展示在商品列表"></div></div>' +
    '<div class="form-row"><div class="field"><label>商品详情介绍（换行分段，· 开头为卖点行）</label>' +
    '<textarea id="pfDetail" rows="5" style="min-width:420px" placeholder="详情页展示的介绍文字&#10;· 高清 1080P&#10;· 3-5 分钟生成"></textarea></div></div>' +
    '<div class="form-row"><div class="field"><label>封面图（可选，上传后替代 emoji）</label><input type="file" id="pfImg" accept="image/*"></div>' +
    '<div class="field"><label>预览</label><div class="qr-preview" id="pfImgPreview">未上传</div></div></div>' +
    '<button class="btn btn-primary btn-sm" onclick="saveProductForm()">保存商品</button> ' +
    '<button class="btn btn-light btn-sm" onclick="hideProductForm()">取消</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>封面</th><th>名称</th><th>价格</th><th>已售</th><th>一句话介绍</th><th>操作</th></tr></thead><tbody>' +
    (list.length ? list.map(p =>
      '<tr><td>' + (p.img ? '<img src="' + p.img + '" style="width:44px;height:44px;object-fit:cover;border-radius:8px">' : '<div style="width:44px;height:44px;border-radius:8px;background:#F1EDFB;display:flex;align-items:center;justify-content:center;font-size:22px">' + esc(p.emoji || '🎁') + '</div>') + '</td>' +
      '<td><b>' + esc(p.name) + '</b></td><td>¥' + esc(p.price) + '</td><td>' + esc(p.sold || 0) + '</td><td style="max-width:220px;font-size:12px;color:#9A94B0">' + esc(p.brief || '') + '</td>' +
      '<td><button class="btn btn-light btn-sm" onclick="showProductForm(\'' + p.id + '\')">编辑</button> ' +
      '<button class="btn btn-danger btn-sm" onclick="delProduct(\'' + p.id + '\')">删除</button></td></tr>'
    ).join('') : '<tr><td colspan="6"><div class="empty">暂无商品</div></td></tr>') +
    '</tbody></table></div></div>';
}
function showProductForm(id) {
  editingProductId = id || '';
  const p = id ? siteData.products.find(x => x.id === id) : null;
  document.getElementById('productFormWrap').style.display = 'block';
  document.getElementById('pfName').value = p ? p.name : '';
  document.getElementById('pfPrice').value = p ? p.price : '';
  document.getElementById('pfSold').value = p ? (p.sold || 0) : '';
  document.getElementById('pfEmoji').value = p ? (p.emoji || '') : '';
  document.getElementById('pfBrief').value = p ? (p.brief || '') : '';
  document.getElementById('pfDetail').value = p ? (p.detail || '') : '';
  document.getElementById('pfImg').value = '';
  const prev = document.getElementById('pfImgPreview');
  if (p && p.img) { prev.innerHTML = '<img src="' + p.img + '">'; prev._b64 = p.img; } else { prev.textContent = '未上传'; prev._b64 = ''; }
  document.getElementById('pfImg').onchange = function () {
    const f = this.files[0];
    if (!f) return;
    if (f.size > 1200 * 1024) { toast('图片过大（>1.2MB），请压缩后上传'); this.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      const el = document.getElementById('pfImgPreview');
      el.innerHTML = '<img src="' + r.result + '">';
      el._b64 = r.result;
    };
    r.readAsDataURL(f);
  };
}
function hideProductForm() { document.getElementById('productFormWrap').style.display = 'none'; }
function saveProductForm() {
  const name = document.getElementById('pfName').value.trim();
  const price = document.getElementById('pfPrice').value.trim();
  if (!name || !price) { toast('名称和价格必填'); return; }
  const b64 = document.getElementById('pfImgPreview')._b64 || '';
  const data = {
    name: name,
    price: price,
    sold: parseInt(document.getElementById('pfSold').value, 10) || 0,
    emoji: document.getElementById('pfEmoji').value.trim() || '🎁',
    brief: document.getElementById('pfBrief').value.trim(),
    detail: document.getElementById('pfDetail').value,
    img: b64
  };
  if (editingProductId) {
    const p = siteData.products.find(x => x.id === editingProductId);
    if (!b64 && p) data.img = p.img || '';
    Object.assign(p, data);
    toast('商品已更新');
  } else {
    data.id = 'p' + Date.now();
    siteData.products.unshift(data);
    toast('商品已新增');
  }
  persistSiteData();
  renderProducts(document.getElementById('tabContent'));
}
function delProduct(id) {
  if (!confirm('确定删除该商品？')) return;
  siteData.products = siteData.products.filter(p => p.id !== id);
  persistSiteData();
  toast('已删除');
  renderProducts(document.getElementById('tabContent'));
}

/* ===== 充值套餐价格 ===== */
function renderPkgs(c) {
  siteData = loadSiteData();
  const list = siteData.packages || [];
  c.innerHTML =
    '<div class="card"><div class="toolbar"><button class="btn btn-primary btn-sm" onclick="addPkg()">＋ 新增套餐</button>' +
    '<span style="font-size:12px;color:#9A94B0;margin-left:10px;">改动保存后，前台「念想值会员中心」刷新即见</span></div>' +
    '<div class="table-wrap"><table><thead><tr><th>套餐名</th><th>权益描述</th><th>念想值</th><th>价格(¥)</th><th>周期</th><th>角标</th><th>操作</th></tr></thead><tbody>' +
    (list.length ? list.map(pk =>
      '<tr><td><b>' + esc(pk.name) + '</b></td><td>' + esc(pk.desc) + '</td>' +
      '<td>' + esc(pk.credits) + '</td><td><b style="color:#7C6AF2">¥' + esc(pk.price) + '</b></td>' +
      '<td>' + esc(pk.period || '一次性') + '</td>' +
      '<td>' + (pk.tag ? '<span class="tag tag-ok">' + esc(pk.tag) + '</span>' : '—') + '</td>' +
      '<td><button class="btn btn-light btn-sm" onclick="editPkg(\'' + pk.id + '\')">编辑</button> ' +
      '<button class="btn btn-danger btn-sm" onclick="delPkg(\'' + pk.id + '\')">删除</button></td></tr>'
    ).join('') : '<tr><td colspan="7"><div class="empty">暂无套餐，点上方按钮新增</div></td></tr>') +
    '</tbody></table></div></div>';
}
function addPkg() {
  siteData = loadSiteData();
  const name = prompt('套餐名称（如：陪伴月卡）'); if (!name) return;
  const desc = prompt('权益描述（如：200 念想值 · 含3次音色克隆）', '') || '';
  const credits = parseInt(prompt('念想值数量（数字）', '50'), 10);
  if (!(credits > 0)) { toast('念想值需为正整数'); return; }
  const price = prompt('售价（元，如 9.9）', '9.9');
  if (!price || !(parseFloat(price) >= 0)) { toast('价格无效'); return; }
  const period = prompt('周期文案（一次性 / 月 / 季 / 年）', '一次性') || '一次性';
  const tag = prompt('角标文案（如：推荐，留空则不显示）', '') || '';
  siteData.packages.push({ id: 'pk' + Date.now(), name: name, desc: desc, credits: credits, price: price, period: period, tag: tag });
  persistSiteData();
  toast('套餐已新增，前台刷新即见');
  renderPkgs(document.getElementById('tabContent'));
}
function editPkg(id) {
  siteData = loadSiteData();
  const pk = (siteData.packages || []).find(x => x.id === id);
  if (!pk) return;
  const name = prompt('套餐名称', pk.name); if (name === null) return;
  const desc = prompt('权益描述', pk.desc); if (desc === null) return;
  const credits = prompt('念想值数量', String(pk.credits)); if (credits === null) return;
  const price = prompt('售价（元）', String(pk.price)); if (price === null) return;
  const period = prompt('周期文案', pk.period || '一次性'); if (period === null) return;
  const tag = prompt('角标文案（留空不显示）', pk.tag || ''); if (tag === null) return;
  Object.assign(pk, { name: name || pk.name, desc: desc, credits: parseInt(credits, 10) || pk.credits, price: price || pk.price, period: period, tag: tag });
  persistSiteData();
  toast('套餐已保存，前台刷新即见');
  renderPkgs(document.getElementById('tabContent'));
}
function delPkg(id) {
  if (!confirm('确定删除该套餐？')) return;
  siteData = loadSiteData();
  siteData.packages = (siteData.packages || []).filter(x => x.id !== id);
  persistSiteData();
  toast('已删除');
  renderPkgs(document.getElementById('tabContent'));
}

/* ===== 客服 / 合作设置 ===== */
function renderContact(c) {
  siteData = loadSiteData();
  c.innerHTML =
    '<div class="card"><b>📮 客服咨询二维码</b>' +
    '<div style="display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;">' +
    '<div><div class="qr-preview" id="svcPreview">' + (siteData.serviceQr ? '<img src="' + siteData.serviceQr + '">' : '未上传<br>前台显示占位框') + '</div>' +
    '<input type="file" id="svcFile" accept="image/*" style="font-size:12px"> <button class="btn btn-primary btn-sm" onclick="uploadImg(\'svcFile\',\'svcPreview\',\'serviceQr\')">上传并保存</button></div>' +
    '<div class="field" style="flex:1;min-width:220px"><label>二维码下方说明文字</label><textarea id="svcText" rows="3" style="width:100%">' + esc(siteData.serviceText) + '</textarea>' +
    '<button class="btn btn-light btn-sm" style="margin-top:8px" onclick="saveText(\'svcText\',\'serviceText\')">保存文字</button></div>' +
    '</div></div>' +
    '<div class="card"><b>🤝 合作联系图片</b>' +
    '<div style="display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;">' +
    '<div><div class="qr-preview" id="coopPreview">' + (siteData.coopImg ? '<img src="' + siteData.coopImg + '">' : '未上传<br>前台显示占位框') + '</div>' +
    '<input type="file" id="coopFile" accept="image/*" style="font-size:12px"> <button class="btn btn-primary btn-sm" onclick="uploadImg(\'coopFile\',\'coopPreview\',\'coopImg\')">上传并保存</button></div>' +
    '<div class="field" style="flex:1;min-width:220px"><label>图片下方说明文字</label><textarea id="coopText" rows="3" style="width:100%">' + esc(siteData.coopText) + '</textarea>' +
    '<button class="btn btn-light btn-sm" style="margin-top:8px" onclick="saveText(\'coopText\',\'coopText\')">保存文字</button></div>' +
    '</div></div>';
}
function uploadImg(fileId, previewId, key) {
  const f = document.getElementById(fileId).files[0];
  if (!f) { toast('先选择图片'); return; }
  if (f.size > 1200 * 1024) { toast('图片过大（>1.2MB），请压缩后上传'); return; }
  const r = new FileReader();
  r.onload = () => {
    siteData[key] = r.result;
    persistSiteData();
    document.getElementById(previewId).innerHTML = '<img src="' + r.result + '">';
    toast('已保存，前台刷新后生效');
  };
  r.readAsDataURL(f);
}
function saveText(inputId, key) {
  siteData[key] = document.getElementById(inputId).value;
  persistSiteData();
  toast('已保存，前台刷新后生效');
}

/* ===== 数据管理 ===== */
function renderDataTab(c) {
  c.innerHTML =
    '<div class="card"><b>导出 / 导入配置</b>' +
    '<div style="font-size:12px;color:#9A94B0;margin:8px 0 14px;line-height:1.8">导出内容包含：商品、代理、客服二维码、合作图片。会员与订单单独导出。跨设备发布：把导出的 JSON 放回网站目录，或在新设备后台导入。</div>' +
    '<div class="toolbar">' +
    '<button class="btn btn-primary btn-sm" onclick="exportAll()">⬇️ 导出全部数据 JSON</button>' +
    '<label class="btn btn-light btn-sm" style="display:inline-block">⬆️ 导入 JSON<input type="file" id="importFile" accept=".json" style="display:none" onchange="importAll(this)"></label>' +
    '</div></div>' +
    '<div class="card"><b>🔑 后台密码</b>' +
    '<div class="toolbar" style="margin-top:12px">' +
    '<input id="newPass" placeholder="设置新密码" style="padding:9px 12px;border:1.5px solid #E4E0F2;border-radius:10px;outline:none">' +
    '<button class="btn btn-primary btn-sm" onclick="changePass()">修改密码</button></div></div>' +
    '<div class="card" style="border:1px solid #F5C6C6"><b style="color:#E34D4D">⚠️ 危险操作</b>' +
    '<div style="font-size:12px;color:#9A94B0;margin:8px 0 14px">重置将清空后台全部配置并恢复演示数据（会员、订单、商品、代理全部还原）。</div>' +
    '<button class="btn btn-danger btn-sm" onclick="resetAll()">重置全部演示数据</button></div>';
}
function exportAll() {
  const dump = {
    exportedAt: new Date().toISOString(),
    siteData: loadSiteData(),
    users: getUsers(),
    orders: getOrders()
  };
  downloadFile('chaojinian-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(dump, null, 2));
  toast('备份已下载');
}
function importAll(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const dump = JSON.parse(r.result);
      if (!dump.siteData) { toast('文件格式不对'); return; }
      if (!confirm('导入将覆盖当前全部后台数据，继续？')) return;
      saveSiteData(dump.siteData);
      if (dump.users) saveUsers(dump.users);
      if (dump.orders) saveOrders(dump.orders);
      siteData = loadSiteData();
      toast('导入成功');
      switchTab('dash', document.querySelector('.nav-item'));
    } catch (e) { toast('JSON 解析失败'); }
  };
  r.readAsText(f);
}
function changePass() {
  const v = document.getElementById('newPass').value.trim();
  if (v.length < 5) { toast('密码至少 5 位'); return; }
  localStorage.setItem('yn_admin_pass', v);
  toast('密码已修改');
}
function resetAll() {
  if (!confirm('确定重置全部数据？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要重置吗？')) return;
  localStorage.removeItem(SITE_DATA_KEY);
  localStorage.removeItem(SITE_USERS_KEY);
  localStorage.removeItem(SITE_ORDERS_KEY);
  location.reload();
}
</script>
